name: Validate frontend

on:
  pull_request:
  push:
    branches: [design/sgt-app-visual-refresh, feature/sgt-core-completion]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
